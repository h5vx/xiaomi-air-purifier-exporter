[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiaomi-air-purifier-exporter"
dynamic = ["version"]
description = "Prometheus exporter for Xiaomi Smart Air Purifier Elite over local miIO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "h5vx" }]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "prometheus-client>=0.20",
]
keywords = ["prometheus", "exporter", "xiaomi", "miio", "air-purifier", "grafana"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
# for scripts/read_sensors.py
tools = ["python-miio"]

[project.scripts]
xiaomi-air-purifier-exporter = "xiaomi_air_purifier_exporter.__main__:main"

[project.urls]
Homepage = "https://github.com/h5vx/xiaomi_exporter"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/xiaomi_air_purifier_exporter/__init__.py"
